[settings]
lockfile = true

# Bubble Tea v2 declares the 1.26.4 floor; this repository is nothing but that
# floor, so the pin is the floor rather than a choice above it.
[tools]
lefthook = "latest"
go = "1.26"
goreleaser = "latest"

[hooks]
postinstall = "lefthook install"

[tasks.build]
description = "Build the bulle binary"
run = "go build -tags goolm -o bulle ."

[tasks.check]
description = "Run the full quality gate: gofmt, vet, test, lint"
run = "sh ./scripts/check.sh"

[tasks.test]
description = "Run the tests only"
# -tags goolm for the same reason the release builds carry it: the Matrix
# imports resolve to a pure Go Olm only under that tag, and libolm does not
# build at CGO_ENABLED=0.
run = "go test -tags goolm ./..."

[tasks.format]
description = "Format the Go sources in place"
run = "sh ./scripts/check.sh --format"
