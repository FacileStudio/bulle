# bulle: the terminal harness for the bulle agent SDK.

kind: cli

ignore: [.git, node_modules, vendor, dist, build, target, testdata, .output, coverage]
extensions: [.go]
build_flags: ["-tags=goolm"]

limits:
  fileLines: 250        # filet's own default: split the file
  funcsPerFile: 8
  funcLines: 35         # 30 was the default; route in model.go is a 13-arm
                        # tagged-union dispatcher whose floor is ~31 clean lines
                        # (one forward per arm plus a catch-all). 35 lets that
                        # genuine shape pass without hiding real function bloat.
  funcStatements: 25    # filet's own default
  lineLength: 120       # lll default
  params: 5
  returns: 3
  nesting: 4            # filet's own default
  complexity: 10        # filet's own default
  structFields: 17      # 12 was the default; CronJob is one job file's whole
                        # schema (9 flat keys plus 7 override groups) and Config
                        # is the whole settings file, and splitting either would
                        # hide the schema from the person editing it.
  interfaceMethods: 4   # filet's own default

disabled:
  # gofmt/rustfmt/prettier owns line breaking; every survivor is a line no
  # formatter could have wrapped. Flagging it is noise that teaches people to
  # stop reading the output. Nothing else is disabled: a rule turned off here
  # must be an argument, not a habit.
  - gen.line.long
  - lsp.unavailable
architecture:
  fileNamePattern: '^[a-z0-9_]+\.go$'
  maxDepth: 3
  forbiddenImports:
    .: [github.com/anthropics/anthropic-sdk-go, github.com/openai/openai-go/v3]

# fail on info, matching the Actions gate: every style rule filet has is info
# severity, so holding here means the gate actually has an opinion instead of
# only ever firing on a Go file that does not parse or on a forbidden import.
# The SDK's gate still tolerates info findings (failOn: error); this client
# does not, so a red filet CI here means a red local check too.
failOn: info
