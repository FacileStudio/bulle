version: 2

# Pinned explicitly per CLI-STANDARD §5.2: ProjectName is inferred from the
# repo name when absent, and the archive name_template interpolates it.
project_name: bulle

builds:
  - main: .
    binary: bulle
    env:
      - CGO_ENABLED=0
    # goolm swaps libolm for a pure Go implementation of Olm. Without it
    # maunium.net/go/mautrix, which the chat surface imports, pulls in an
    # all-cgo package and every target below stops compiling.
    flags:
      - -tags=goolm
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# A cask, not a formula: goreleaser soft-deprecated `brews` in v2.10 and hard-
# deprecated it in v2.16, and casks are the supported way to ship a prebuilt
# binary.
homebrew_casks:
  - name: bulle
    homepage: https://github.com/FacileStudio/bulle
    description: Terminal coding agent — the human harness for the bulle SDK
    binaries:
      - bulle
    repository:
      owner: FacileStudio
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binaries are unsigned, and a cask download carries the quarantine
    # attribute where a formula's did not. Without this the first run dies on
    # "cannot be opened because the developer cannot be verified".
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bulle"]
          end

changelog:
  sort: asc
